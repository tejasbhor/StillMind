# Local development: Docker db/redis only
# Run locally: Terminal 1: cd apps\api && uv run uvicorn...
#                 Terminal 2: cd apps\web && npm run dev...

services:
  # Database - PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: stillmind_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stillmind
      POSTGRES_USER: stillmind
      POSTGRES_PASSWORD: stillmind_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stillmind -d stillmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache - Redis
  redis:
    image: redis:7-alpine
    container_name: stillmind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend
  backend:
    build: 
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: stillmind_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://stillmind:stillmind_secret@db:5432/stillmind
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    ports:
      - "8000:8000"

  # Web Frontend
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: stillmind_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1

  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: stillmind_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config: