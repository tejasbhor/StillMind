# Local development: Docker db/redis only
# Run locally: Terminal 1: cd apps\api && uv run uvicorn...
#                 Terminal 2: cd apps\web && npm run dev...

services:
  # Database - Isolated internally
  db:
    image: postgres:16-alpine
    container_name: stillmind_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-stillmind}
      POSTGRES_USER: ${DB_USER:-stillmind}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stillmind_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stillmind} -d ${DB_NAME:-stillmind}"]
    deploy:
      resources:
        limits:
          memory: 350M

  # Cache - Isolated internally
  redis:
    image: redis:7-alpine
    container_name: stillmind_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - stillmind_internal
    deploy:
      resources:
        limits:
          memory: 100M

  # API Backend - Reachable by Proxy
  backend:
    build: 
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: stillmind_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stillmind_internal
      - proxy_net
    deploy:
      resources:
        limits:
          memory: 500M

  # Web Frontend - Reachable by Proxy
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: stillmind_web
    restart: unless-stopped
    env_file: .env
    networks:
      - stillmind_internal
      - proxy_net
    deploy:
      resources:
        limits:
          memory: 700M

networks:
  stillmind_internal:
    driver: bridge
  proxy_net:
    external: true
    name: civiclens_civiclens_net

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config: