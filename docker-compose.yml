version: "3.9"

services:
  caddy:
    image: caddy:2-alpine
    container_name: stillmind_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: stillmind_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: apps/api
      dockerfile: Dockerfile
    container_name: stillmind_backend
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://stillmind:stillmind_secret@db:5432/stillmind
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: stillmind_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stillmind
      POSTGRES_USER: stillmind
      POSTGRES_PASSWORD: stillmind_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stillmind -d stillmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stillmind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
